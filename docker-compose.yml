services:
  backend:
    build: ./backend
    ports: ["8001:8001"]
    environment:
      CODEREVIEWX_DATABASE_URL: sqlite:////data/codereviewx.db
      CODEREVIEWX_ENVIRONMENT: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["crx-data:/data"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  crx-data:
